<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="blueArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="orangeYukGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="greenArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="torsoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Central Emblem Group -->
  <g id="emblem" transform="translate(10, -10)">
    <!-- Circular Green Arc / Base -->
    <path d="M 230 350 C 310 380 430 340 455 240 C 445 285 390 355 290 350 Z" fill="url(#greenArcGrad)" />
    
    <!-- West Java Silhouette / Warm Accent behind arrow -->
    <path d="M 330 240 C 345 210 380 230 405 270 C 375 285 340 270 330 240 Z" fill="#F97316" opacity="0.95" />

    <!-- Candi / Gedung Sate Pagoda Silhouette (Left) -->
    <g fill="#1E3A8A">
      <!-- Tiered temple stupas -->
      <path d="M 175 260 L 180 260 L 180 245 L 185 245 L 185 230 L 190 230 L 190 215 L 195 215 L 195 230 L 200 230 L 200 245 L 205 245 L 205 260 L 210 260 L 215 280 L 170 280 Z" />
      <!-- Left smaller tower -->
      <path d="M 140 275 L 145 275 L 145 260 L 150 260 L 150 250 L 153 250 L 153 260 L 158 260 L 158 275 L 162 275 L 165 290 L 135 290 Z" />
      <!-- Base wall -->
      <path d="M 130 285 L 235 285 C 235 320 200 340 170 330 C 145 320 135 300 130 285 Z" />
    </g>

    <!-- Stylized Human Figure with Kujang blade -->
    <!-- Head -->
    <circle cx="300" cy="65" r="18" fill="url(#headGrad)" />
    
    <!-- Traditional Sunda Kujang blade held in hand -->
    <path d="M 245 40 C 220 30 185 45 165 40 C 180 55 200 65 225 70 C 240 75 250 85 245 90 C 240 92 230 85 210 80 L 205 88 C 225 96 240 100 250 95 C 262 90 265 75 255 60 Z" fill="#2563EB" />
    
    <!-- Arms & Raised Hand -->
    <path d="M 290 85 C 275 80 255 70 250 62 C 245 75 265 95 280 102 Z" fill="#1D4ED8" />
    <path d="M 315 85 C 340 75 365 70 375 75 C 370 85 345 95 325 105 Z" fill="#10B981" />

    <!-- Torso Swoop / Flowing Body -->
    <path d="M 298 90 C 315 115 325 150 305 190 C 290 220 265 245 235 265 C 255 235 270 200 275 165 C 280 135 270 105 298 90 Z" fill="url(#torsoGrad)" />
    <!-- Dynamic Ribbon Layer (Orange Accent) -->
    <path d="M 312 110 C 322 135 320 165 300 195 C 285 220 260 240 240 255 C 258 235 272 210 275 185 C 278 160 272 135 312 110 Z" fill="#F97316" />

    <!-- Dynamic Growth Chart Arrow (Navy outlined in deep blue) -->
    <!-- Shadow / Border outline -->
    <path d="M 170 365 L 290 245 L 340 315 L 435 195 L 400 190 L 485 95 L 485 205 L 450 195 L 345 330 L 290 255 L 180 375 Z" fill="#1E3A8A" />
    <!-- Inner bright gradient arrow -->
    <path d="M 175 363 L 290 248 L 340 318 L 438 198 L 410 194 L 480 105 L 480 198 L 448 193 L 345 326 L 290 252 L 185 368 Z" fill="url(#blueArrowGrad)" />
  </g>

  <!-- Typography: DIGAWE YUK -->
  <g id="brand-text">
    <text x="50" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="1" fill="#1E3A8A">DIGAWE</text>
    <text x="390" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="1" fill="url(#orangeYukGrad)">YUK</text>
  </g>
</svg>