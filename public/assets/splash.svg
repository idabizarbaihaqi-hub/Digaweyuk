<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF" />
      <stop offset="35%" stop-color="#F1F7FF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="blueArrowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="orangeYukGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="greenArcGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="torsoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="headGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="540" height="960" fill="url(#skyGrad)" />

  <!-- Subtle Geometric Polygons in background -->
  <g opacity="0.4" stroke="#93C5FD" stroke-width="0.75" fill="none">
    <polygon points="0,0 270,180 540,50" />
    <polygon points="270,180 540,240 380,380" />
    <polygon points="0,0 120,320 270,180" />
    <polygon points="0,480 180,620 0,720" />
    <polygon points="540,520 420,680 540,780" />
    <polygon points="0,960 270,820 540,960" />
  </g>

  <!-- Watermark of Gedung Sate in Background -->
  <g transform="translate(135, 140) scale(0.65)" fill="#94A3B8" opacity="0.28">
    <!-- Gedung Sate roof spire / satay skewer stick -->
    <rect x="202" y="20" width="6" height="55" rx="3" />
    <circle cx="205" cy="30" r="8" />
    <circle cx="205" cy="45" r="7" />
    <circle cx="205" cy="58" r="6" />
    <!-- Tiered roof pavilions -->
    <path d="M 160 85 L 250 85 L 235 110 L 175 110 Z" />
    <path d="M 140 115 L 270 115 L 255 145 L 155 145 Z" />
    <path d="M 115 150 L 295 150 L 280 180 L 130 180 Z" />
    <!-- Colonnade windows -->
    <rect x="155" y="185" width="12" height="25" rx="3" />
    <rect x="175" y="185" width="12" height="25" rx="3" />
    <rect x="195" y="185" width="12" height="25" rx="3" />
    <rect x="215" y="185" width="12" height="25" rx="3" />
    <rect x="235" y="185" width="12" height="25" rx="3" />
    <!-- Main wings -->
    <rect x="20" y="215" width="370" height="90" rx="4" />
    <rect x="0" y="305" width="410" height="20" />
  </g>

  <!-- Perspective Plaza Diagonal Stripes in Foreground / Floor -->
  <g opacity="0.35" stroke="#60A5FA" stroke-width="1.5">
    <line x1="-50" y1="580" x2="350" y2="720" />
    <line x1="-30" y1="620" x2="420" y2="760" />
    <line x1="-10" y1="660" x2="480" y2="800" />
    <line x1="590" y1="540" x2="200" y2="700" />
    <line x1="610" y1="580" x2="250" y2="740" />
    <line x1="630" y1="620" x2="300" y2="780" />
  </g>

  <!-- Central Logo Group (Scaled & Centered) -->
  <g transform="translate(30, 210) scale(0.8)">
    <!-- Circular Green Arc / Base -->
    <path d="M 230 350 C 310 380 430 340 455 240 C 445 285 390 355 290 350 Z" fill="url(#greenArcGrad2)" />
    
    <!-- West Java Silhouette -->
    <path d="M 330 240 C 345 210 380 230 405 270 C 375 285 340 270 330 240 Z" fill="#F97316" opacity="0.95" />

    <!-- Candi Pagoda Silhouette -->
    <g fill="#1E3A8A">
      <path d="M 175 260 L 180 260 L 180 245 L 185 245 L 185 230 L 190 230 L 190 215 L 195 215 L 195 230 L 200 230 L 200 245 L 205 245 L 205 260 L 210 260 L 215 280 L 170 280 Z" />
      <path d="M 140 275 L 145 275 L 145 260 L 150 260 L 150 250 L 153 250 L 153 260 L 158 260 L 158 275 L 162 275 L 165 290 L 135 290 Z" />
      <path d="M 130 285 L 235 285 C 235 320 200 340 170 330 C 145 320 135 300 130 285 Z" />
    </g>

    <!-- Figure with Kujang -->
    <circle cx="300" cy="65" r="18" fill="url(#headGrad2)" />
    <path d="M 245 40 C 220 30 185 45 165 40 C 180 55 200 65 225 70 C 240 75 250 85 245 90 C 240 92 230 85 210 80 L 205 88 C 225 96 240 100 250 95 C 262 90 265 75 255 60 Z" fill="#2563EB" />
    <path d="M 290 85 C 275 80 255 70 250 62 C 245 75 265 95 280 102 Z" fill="#1D4ED8" />
    <path d="M 315 85 C 340 75 365 70 375 75 C 370 85 345 95 325 105 Z" fill="#10B981" />
    <path d="M 298 90 C 315 115 325 150 305 190 C 290 220 265 245 235 265 C 255 235 270 200 275 165 C 280 135 270 105 298 90 Z" fill="url(#torsoGrad2)" />
    <path d="M 312 110 C 322 135 320 165 300 195 C 285 220 260 240 240 255 C 258 235 272 210 275 185 C 278 160 272 135 312 110 Z" fill="#F97316" />

    <!-- Dynamic Growth Arrow -->
    <path d="M 170 365 L 290 245 L 340 315 L 435 195 L 400 190 L 485 95 L 485 205 L 450 195 L 345 330 L 290 255 L 180 375 Z" fill="#1E3A8A" />
    <path d="M 175 363 L 290 248 L 340 318 L 438 198 L 410 194 L 480 105 L 480 198 L 448 193 L 345 326 L 290 252 L 185 368 Z" fill="url(#blueArrowGrad2)" />

    <!-- Title inside splash -->
    <g transform="translate(0, 435)">
      <text x="65" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="1" fill="#1E3A8A">DIGAWE</text>
      <text x="365" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="1" fill="url(#orangeYukGrad2)">YUK</text>
    </g>
  </g>

  <!-- Loading indicator & text at bottom -->
  <g transform="translate(270, 875)">
    <!-- Loading spinner spokes -->
    <circle cx="0" cy="-35" r="3" fill="#1E3A8A" opacity="1.0" />
    <circle cx="14" cy="-28" r="3" fill="#1E3A8A" opacity="0.85" />
    <circle cx="20" cy="-14" r="3" fill="#1E3A8A" opacity="0.7" />
    <circle cx="14" cy="0" r="3" fill="#1E3A8A" opacity="0.55" />
    <circle cx="0" cy="7" r="3" fill="#1E3A8A" opacity="0.4" />
    <circle cx="-14" cy="0" r="3" fill="#1E3A8A" opacity="0.3" />
    <circle cx="-20" cy="-14" r="3" fill="#1E3A8A" opacity="0.2" />
    <circle cx="-14" cy="-28" r="3" fill="#1E3A8A" opacity="0.15" />
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B" letter-spacing="0.5">Loading...</text>
  </g>
</svg>